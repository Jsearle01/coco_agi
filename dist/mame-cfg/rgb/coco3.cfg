<?xml version="1.0"?>
<!--
    coco3.cfg — authored MAME input map for the CoCo3 AGI work (P0.4).

    ★★ WHY THIS FILE EXISTS. Sierra's CoCo3 AGI interpreter needs CTRL+BREAK to get past its
    title screen, and BREAK is unreachable by the obvious routes:
      - natkeyboard:post CANNOT send it — post takes CHARACTERS and BREAK is not one;
      - the stock host binding (End, or Esc) did not reach the emulated machine in practice,
        and Esc is additionally MAME's own quit key, so reaching for it exits the emulator.
    See mame-idioms-coco3-port.md §41f for the measurement behind both statements.

    ★ Port tag, mask and defvalue below are MEASURED from the running machine's ioport, not
    guessed. A cfg with a wrong mask silently does nothing, which is the worst failure mode
    available here:
        field=BREAK  port_tag=:row6  mask=0x0004  defvalue=0x0004  type=IPT_KEYBOARD
        field=CTRL   port_tag=:row6  mask=0x0010  defvalue=0x0010  type=IPT_KEYBOARD

    ─────────────────────────────────────────────────────────────────────────────────────
    WHAT THIS GIVES YOU

        Insert        = CTRL+BREAK in ONE keypress  ← the one you want at the title screen
        Ctrl          = CTRL as normal (unchanged)

    ★ Insert appears in BOTH sequences below. That is deliberate and is the whole trick: a host
    key may drive more than one emulated field, so one press asserts CTRL and BREAK together —
    exactly what a scripted field-assert does, but under your finger instead of on a timer.

    ★★ WHY INSERT, AND WHY *NOT* THE OBVIOUS KEYS — MEASURED, AND IT COST FOUR ATTEMPTS.
    MAME's stock CoCo3 binding for BREAK is `End or Esc`, and NEITHER REACHES THE MACHINE:
    **MAME's UI reserves End, Home, PgUp, PgDn and the arrow keys for menu navigation**, so they
    are consumed before the emulated keyboard sees them. Esc is additionally MAME's quit key, so
    reaching for it as a fallback exits the emulator instead.

    PgDn was tried and failed for exactly the same reason — and the failure was NOT a bad
    binding: an instrumented run proved the cfg was loaded and preserved (both KEYCODE_PGDN
    sequences survived MAME's own rewrite) while the `:row6` BREAK bit never asserted once.
    In the same run `Ctrl` asserted correctly, which is what isolated it to specific keys being
    captured rather than input being broken.

    **Insert is not claimed by MAME's UI, and Jay confirmed it works.** No AGI game needs it,
    so it cannot collide with gameplay typing.

    To use a different key, replace KEYCODE_INSERT in BOTH <newseq> blocks — it must appear in
    both, or you get BREAK without CTRL. Avoid: End / Home / PgUp / PgDn / arrows (MAME UI
    navigation), Esc (MAME quit), Tab (MAME menu), Scroll Lock (UI toggle), F1–F12 (MAME UI),
    and letter keys (the AGI parser needs them).

    ─────────────────────────────────────────────────────────────────────────────────────
    HOW TO USE IT

        mame coco3 -ext fdc -flop1 <disk> -cfg_directory <this directory>

    ★★ MAME REWRITES ITS cfg DIRECTORY ON EXIT. It will save state back over this file and
    drop a default.cfg beside it. .gitignore tracks the authored coco3.cfg and ignores
    dist/mame-cfg/*/default.cfg for that reason — but if you want this template kept pristine,
    copy it to a scratch directory and point -cfg_directory there instead.

    Monitor mode: this is the RGB directory. CLAUDE.md §4 makes RGB the default gate and
    design §2.2 records the AGI palette as EXACT in RGB and UNDEFINED in composite, so a
    composite gate is a separate gate against a separate table — hence the sibling
    dist/mame-cfg/composite/ directory.
-->
<mameconfig version="10">
    <system name="coco3">
        <input>

            <!-- BREAK on Insert. The stock `End` is deliberately DROPPED: MAME's UI consumes
                 it, so leaving it in only suggests a fallback that does not work. -->
            <port tag=":row6" type="KEYBOARD" mask="4" defvalue="4">
                <newseq type="standard">KEYCODE_INSERT</newseq>
            </port>

            <!-- CTRL: the normal Ctrl keys, plus Insert so it is asserted alongside BREAK -->
            <port tag=":row6" type="KEYBOARD" mask="16" defvalue="16">
                <newseq type="standard">KEYCODE_LCONTROL OR KEYCODE_RCONTROL OR KEYCODE_INSERT</newseq>
            </port>

        </input>
    </system>
</mameconfig>
